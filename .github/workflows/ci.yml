name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: uv python install
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/smoke_experiment.py
      - run: uv run --locked --group notebooks python scripts/check_notebooks.py --mode synthetic
      - run: uv run --locked python train_pipeline.py --help
      - run: uv run --locked python train_deep_pipeline.py --help
      - run: uv run --locked python scripts/check_repository.py --tracked

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag skin-lesion-lab:ci .
      - run: docker run --rm skin-lesion-lab:ci
      - name: Run synthetic flow in container
        run: >-
          docker run --rm
          --mount "type=bind,source=$PWD/.git,target=/app/.git,readonly"
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/app
          skin-lesion-lab:ci python scripts/smoke_experiment.py
      - run: docker run --rm skin-lesion-lab:ci python train_pipeline.py --help
      - run: >-
          docker run --rm skin-lesion-lab:ci python -c
          'import cv2, torch, torchvision;
          from src.deep import SmallDropoutCnn;
          x = torch.zeros((1, 3, 64, 64));
          y = SmallDropoutCnn()(x);
          assert y.shape == (1,) and torch.isfinite(y).all();
          assert torch.version.cuda is None'
      - name: Check non-root mounts
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir "$fixture/data" "$fixture/results"
          printf 'synthetic' > "$fixture/data/marker"
          chmod 777 "$fixture/results"
          docker run --rm \
            --mount "type=bind,source=$fixture/data,target=/app/data/raw,readonly" \
            --mount "type=bind,source=$fixture/results,target=/app/results" \
            skin-lesion-lab:ci python -c 'from pathlib import Path; import os; assert os.geteuid() == 10001; assert Path("/app/data/raw/marker").read_text() == "synthetic"; assert not os.access("/app/data/raw", os.W_OK); Path("/app/results/probe").write_text("ok")'
          test "$(cat "$fixture/results/probe")" = ok
