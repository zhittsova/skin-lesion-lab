[project]
name = "bayesian-melanoma-triage"
version = "0.1.0"
description = "Classical and deep learning workflows for skin lesion classification"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.2.0",
    "pandas==3.0.3",
    "scikit-learn==1.8.0",
    "seaborn==0.13.2",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "tqdm==4.67.3",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]
extend-exclude = [
    ".venv",
    "data",
    "models",
    "results",
    "runs",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.uv]
required-version = "==0.12.11"
add-bounds = "exact"

# PyPI's Linux torch wheels include CUDA dependencies. Use the CPU builds there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
